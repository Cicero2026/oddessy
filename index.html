<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>探索口傳：奧德賽計畫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a 3D low-poly sea chart in a framed 16:9 stage (4:5 on phones); header holds the passport,
   chips below group the islands by voyage stage. Single committed look (sunlit sea), colors explicit. */
:root {
  --night: #0F2E4A;
  --navy: #1D3557;
  --gold: #F0B93A;
  --coral: #F2765B;
  --paper: #FFFDF7;
  --ink-soft: #4A5A72;
  --line: #DCE5EE;
  --mist: #CFE3F2;
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--paper);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
.brand { min-width: 0; }
.brand .eyebrow { font-size: 12px; letter-spacing: .2em; color: var(--gold); font-weight: 700; }
.brand h1 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.2; text-wrap: balance; }
.brand h1 small { font-size: .55em; color: var(--mist); margin-left: .4em; }
.passport { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px 12px; }
.passport .label { font-size: 13px; color: var(--mist); white-space: nowrap; }
.passport .label b { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 16px; }
.passport .myth-label { border-left: 1px solid rgba(255,255,255,.2); padding-left: 12px; }
.stamps { display: flex; gap: 6px; flex-wrap: wrap; }
.stamp { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; border: 1.5px dashed rgba(255,255,255,.35); color: rgba(255,255,255,.5); background: transparent; padding: 0; transition: transform .3s; }
.stamp.done { border: 2px solid var(--paper); color: #fff; background: var(--c); transform: rotate(-8deg); }
.reset { border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--mist); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.reset.arm { background: var(--coral); color: #fff; border-color: var(--coral); }

/* stage */
.stage-wrap { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; }
.stage { position: relative; width: 100%; max-width: min(1400px, calc((100vh - 200px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 6px #E9D6A8, 0 0 0 9px #8A6A3F, 0 18px 40px rgba(0,0,0,.45); background: #9FD0EE; }
#gl { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#gl.pointer { cursor: pointer; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap; border: 0; border-radius: 8px; padding: 3px 14px 4px; font-family: var(--font-display); font-size: clamp(14px, 1.5vw, 20px); color: #fff; background: var(--c); box-shadow: 0 3px 0 rgba(0,0,0,.22), 0 6px 14px rgba(0,0,0,.18); }
.tag .ok { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); color: var(--navy); font-size: 12px; margin-left: 6px; vertical-align: 1px; font-family: var(--font-body); font-weight: 700; }
.tag.mentor { background: rgba(255,253,247,.94); color: var(--navy); font-size: 13px; padding: 2px 10px 3px; border-radius: 999px; box-shadow: 0 3px 10px rgba(0,0,0,.2); font-family: var(--font-body); font-weight: 700; }
.tag.mentor::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.tag.hint { background: #fff; color: var(--navy); border-radius: 999px; padding: 6px 16px; font-size: 16px; pointer-events: none; }
.tag.hint::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff; }
.tag[hidden] { display: none; }
.hud { position: absolute; left: 12px; top: 12px; z-index: 4; display: flex; gap: 8px; flex-wrap: wrap; }
.hud #btnSound[aria-pressed="true"] { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 700; }
.hud button { background: rgba(15,46,74,.82); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.intro-cap { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); z-index: 4; width: max-content; max-width: calc(100% - 32px); text-align: center; font-family: var(--font-display); font-size: clamp(18px, 2.6vw, 32px); color: #fff; text-shadow: 0 2px 10px rgba(10,30,50,.75), 0 0 2px rgba(10,30,50,.9); transition: opacity .5s; pointer-events: none; opacity: 0; }
.skip { position: absolute; right: 12px; bottom: 12px; z-index: 4; background: rgba(255,255,255,.92); color: var(--navy); border: 0; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--navy); font-size: 16px; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; max-width: 1400px; width: 100%; margin: 0 auto; padding-bottom: 4px; align-items: center; scrollbar-width: thin; }
.chips .grp { flex: 0 0 auto; font-size: 12px; color: var(--mist); letter-spacing: .1em; padding: 0 2px 0 4px; white-space: nowrap; }
.chips .grp:not(:first-child)::before { content: "→"; margin-right: 8px; color: var(--gold); }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: var(--paper); border-radius: 999px; padding: 5px 13px 5px 7px; font-size: 14px; }
.chip .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-size: 11px; color: #fff; }
.chip:hover { background: rgba(255,255,255,.14); }
.chip.done .dot::after { content: "✓"; }

/* island panel */
.panel { position: absolute; z-index: 5; top: 14px; right: 14px; bottom: 14px; width: min(390px, 44%); background: var(--paper); color: var(--navy); border-radius: 18px; box-shadow: 0 14px 40px rgba(10,30,50,.35); display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 30px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.panel.left { right: auto; left: 14px; transform: translateX(calc(-100% - 30px)); }
.panel.open { transform: none; }
.panel-head { padding: 18px 20px 14px; background: var(--c); color: #fff; position: relative; }
.panel-head .en { font-size: 11px; letter-spacing: .2em; opacity: .9; font-weight: 700; text-transform: uppercase; }
.panel-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 2px 0 0; line-height: 1.2; }
.panel-head .tagline { margin: 4px 0 0; font-size: 15px; opacity: .95; }
.close { position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.22); color: #fff; font-size: 20px; line-height: 1; }
.panel-body { padding: 16px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.panel-body p { margin: 0; }
.sec-title { font-size: 12px; letter-spacing: .16em; font-weight: 700; color: var(--ink-soft); margin: 0 0 6px; }
.opps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.opps li { display: flex; gap: 10px; align-items: flex-start; }
.opps li::before { content: ""; flex: 0 0 8px; height: 8px; margin-top: 8px; border-radius: 2px; background: var(--c); transform: rotate(45deg); }
.task { border: 2px dashed var(--c); border-radius: 14px; padding: 14px; background: #fff; display: flex; flex-direction: column; gap: 10px; position: relative; }
.task h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.task textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; color: var(--navy); background: #FBFCFE; }
.dash { display: grid; grid-template-columns: auto 1fr 2.2em; gap: 6px 10px; align-items: center; }
.dash label { font-weight: 700; font-size: 14px; }
.dash input { width: 100%; accent-color: var(--c); }
.dash output { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; color: var(--c); }
.cmp { display: flex; flex-direction: column; gap: 10px; }
.cmp .dash { grid-template-columns: auto 1fr 5.2em; }
.cmp-bars { height: 120px; display: flex; align-items: flex-end; gap: 2px; padding: 6px 4px 0; border-bottom: 2px solid var(--line); background: #FBF7EA; border-radius: 10px 10px 0 0; }
.cmp-bars .bar { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: 2px 2px 0 0; overflow: hidden; }
.cmp-bars .g { background: var(--c); }
.cmp-bars .p { background: #A9B9CC; }
.cmp-legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-soft); flex-wrap: wrap; }
.cmp-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.cmp-legend .sw.p { background: #A9B9CC; } .cmp-legend .sw.g { background: var(--c); }
.cmp-sum { margin: 0; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.cmp-sum b { color: #8A6A00; }
.cmp-note { margin: 0; font-size: 12px; color: var(--ink-soft); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; background: var(--coral); color: #fff; }
.btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
.seal { position: absolute; right: 10px; top: -18px; width: 74px; height: 74px; border-radius: 50%; border: 3px solid var(--c); color: var(--c); background: rgba(255,255,255,.92); display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-size: 13px; line-height: 1.15; transform: rotate(-14deg) scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
.seal b { display: block; font-size: 22px; font-weight: 400; }
.task.done .seal { transform: rotate(-14deg) scale(1); }
.saved { font-size: 13px; color: var(--ink-soft); }

/* character card */
.card { position: absolute; z-index: 6; width: min(300px, calc(100% - 24px)); background: var(--paper); color: var(--navy); border-radius: 16px; padding: 14px 16px; box-shadow: 0 12px 30px rgba(10,30,50,.35); border: 2px solid var(--c); display: flex; flex-direction: column; gap: 6px; }
.card .kind { font-size: 11px; letter-spacing: .18em; font-weight: 700; color: var(--c); text-transform: uppercase; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.25; padding-right: 30px; }
.card .quote { margin: 0; font-size: 15px; }
.card .tip { margin: 0; font-size: 13.5px; color: var(--ink-soft); background: #F1F5FA; border-radius: 10px; padding: 8px 10px; }
.card .tip b { color: var(--navy); }
.card .sample { font-size: 12px; color: var(--ink-soft); }
.card .close { background: #EEF2F7; color: var(--navy); width: 30px; height: 30px; right: 8px; top: 8px; font-size: 18px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20; transform: translate(-50%, 20px); opacity: 0; visibility: hidden; background: var(--gold); color: var(--navy); font-weight: 700; padding: 10px 18px; border-radius: 999px; transition: transform .4s, opacity .4s, visibility .4s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

@media (max-width: 760px) {
  body { padding-block: 10px 12px; gap: 10px; }
  .brand h1 small { display: block; margin: 2px 0 0; font-size: 14px; }
  .stage-wrap { flex: 0 0 auto; }
  .stage { aspect-ratio: 4 / 5; max-width: 100%; max-height: 66vh; border-radius: 18px; }
  .panel { position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 62vh; border-radius: 20px 20px 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel.left { left: 0; transform: translateY(105%); }
  .panel.open, .panel.left.open { transform: none; }
  .passport { width: 100%; justify-content: space-between; }
  .stamp { width: 26px; height: 26px; font-size: 12px; }
  .tag.mentor { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  .panel, .seal, .toast, .intro-cap { transition: none; }
}
</style>
</head>
<body>


<header class="top">
  <div class="brand">
    <div class="eyebrow">世新大學 口語傳播學系</div>
    <h1>探索口傳：奧德賽計畫<small>搭上口傳號，點一座島嶼啟航</small></h1>
  </div>
  <div class="passport" aria-label="航海護照">
    <span class="label">航海護照 <b id="count">0</b> / 9</span>
    <div class="stamps" id="stamps"></div>
    <span class="label myth-label">神話圖鑑 <b id="mythCount">0</b> / 5</span>
    <button class="reset" id="reset" type="button">重新出航</button>
  </div>
</header>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="口傳號 3D 航海地圖：左側是世新港，九座島嶼由近岸排到地平線"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud" id="hud">
      <button type="button" id="btnOverview">看全景</button>
      <button type="button" id="btnIntro">重播開場</button>
      <button type="button" id="btnSound" aria-pressed="false">♪ 開啟音樂</button>
    </div>
    <div class="intro-cap" id="introCap" aria-live="polite"></div>
    <button class="skip" id="skip" type="button" hidden>略過開場</button>
    <aside class="panel" id="panel" aria-live="polite" aria-hidden="true"></aside>
    <div class="card" id="card" role="dialog" hidden></div>
  </div>
</div>

<nav class="chips" id="chips" aria-label="島嶼清單"></nav>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
/* ================= content ================= */
const ISLANDS = [
  { id: 'life', name: '生活島', en: 'Life', stage: '近岸', x: -24, z: 11, r: 6, seed: 1.3, accent: '#8B6BC8', grass: 0xA6D67E,
    tagline: '看看現在的儀表板',
    intro: '剛上岸，先停下來看看自己的人生儀表板：學習、遊戲、愛與健康。再加上社團、朋友與運動的補給，照顧好現在的自己，才走得遠。',

  { id: 'treasure', name: '金銀島', en: 'Treasure', stage: '近岸', x: -31, z: 26, r: 6, seed: 9.6, accent: '#D4A017', grass: 0xB5D67A,

  { id: 'social', name: '社群島', en: 'Social Media', stage: '三大能力', x: 0, z: 21, r: 6, seed: 5.2, accent: '#D0528F', grass: 0x8FD0A8,
    tagline: '讓聲音傳向遠方',

function hull(len, wid, h, color) {
  const s = new T.Shape();
  s.moveTo(-len / 2, h); s.lineTo(len / 2 + .5, h + .2); s.quadraticCurveTo(len / 2 - .2, -.1, len / 2 - 1, -.3); s.lineTo(-len / 2 + .5, -.3); s.quadraticCurveTo(-len / 2 - .1, .1, -len / 2, h);
  const g = new T.ExtrudeGeometry(s, { depth: wid, bevelEnabled: true, bevelThickness: .18, bevelSize: .14, bevelSegments: 1 });
  g.translate(0, 0, -wid / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const u = p.getX(i) / (len / 2); const k = u > 0 ? 1 - .8 * Math.pow(u, 2.2) : 1 - .25 * u * u; p.setZ(i, p.getZ(i) * Math.max(.08, k)); }
  g.computeVertexNormals();
  return M(g, color);
}

  });
}

const OBST = ISLANDS.map(i => ({ id: i.id, x: i.x, z: i.z, r: i.r * 1.3 }))

function planRoute(from, to, ignore) {

    let changed = false; const np = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      let worst = null, wd = 1e9;
      for (const o of OBST) {
        if (o.id === ignore) continue;
        if (Math.hypot(o.x - a.x, o.z - a.z) < o.r + .5 || Math.hypot(o.x - b.x, o.z - b.z) < o.r + .5) continue;

        if (s.u > 0 && s.u < 1 && s.d < o.r + 2 && s.d < wd) { wd = s.d; worst = { o, s }; }

      if (worst) {

  if (!resetBtn.classList.contains('arm')) {

    armTimer = setTimeout(() => { resetBtn.classList.remove('arm'); resetBtn.textContent = '重新出航'; }, 3000); return;
  }
  clearTimeout(armTimer);
  state = { done: {}, notes: {}, myths: {}, introSeen: true, music: state.music }; save();
  resetBtn.classList.remove('arm'); resetBtn.textContent = '重新出航';
  renderProgress(); closeCard(); goHome(); firstSail = false; hintTag.el.hidden = false;
  toast('印章已清除，口傳號回到世新港');
});

/* ================= resize + loop ================= */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();
boat.position.copy(HOME);
{ const o = overviewPose(); camera.position.copy(o.pos); controls.target.copy(o.target); }

let lastNow = performance.now();
const clock0 = performance.now();
const followV = new T.Vector3();
function frame(now) {
  const dt = Math.min(.05, (now - lastNow) / 1000); lastNow = now;
  const t = (now - clock0) / 1000;
  updateWater(t);
  for (const f of anim) f(t, dt);
  if (trip) {
    const raw = clamp((now - trip.start) / trip.dur, 0, 1), u = ease(raw);
    const p = trip.curve.getPointAt(u), tg = trip.curve.getTangentAt(Math.min(.999, Math.max(.001, u)));
    boat.position.x = p.x; boat.position.z = p.z;
    let d = Math.atan2(-tg.z, tg.x) - heading; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; heading += d * .2;
    wakeAcc += dt;
    if (wakeAcc > .06 && !reduced) {
      wakeAcc = 0; const w = wakes[wakeI++ % wakes.length];
      w.m.position.set(boat.position.x - Math.cos(heading) * 3.4, .45, boat.position.z + Math.sin(heading) * 3.4); w.t = now; w.m.visible = true;
    }
    followV.set(p.x, 0, p.z).sub(controls.target).multiplyScalar(.05);
    controls.target.add(followV); camera.position.add(followV);
    if (raw >= 1) { const after = trip.after; trip = null; routeLine.visible = false; if (after) after(); }
  }
  routeLine.material.dashOffset = -t * 2;
  for (const w of wakes) { if (!w.m.visible) continue; const a = (now - w.t) / 1600; if (a >= 1) { w.m.visible = false; continue; } w.m.material.opacity = (1 - a) * .55; w.m.scale.setScalar(1 + a * 2.2); w.m.position.y = .42 + waveH(w.m.position.x, w.m.position.z, t); }
  const bx = boat.position.x, bz = boat.position.z;
  boat.position.y = waveH(bx, bz, t) + .1;
  const sx = (waveH(bx + 1, bz, t) - waveH(bx - 1, bz, t)) / 2, sz = (waveH(bx, bz + 1, t) - waveH(bx, bz - 1, t)) / 2;
  boat.rotation.order = 'YXZ';
  boat.rotation.y = heading;
  boat.rotation.x = -(Math.cos(heading) * sz + Math.sin(heading) * sx) * 1.2;
  boat.rotation.z = (Math.cos(heading) * sx - Math.sin(heading) * sz) * 1.2;
  boat.userData.flag.rotation.y = Math.sin(t * 5) * .3;
  if (intro) updateIntro(now, t);
  if (camTween) {
    const k = clamp((now - camTween.start) / camTween.dur, 0, 1), e = ease(k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (k >= 1) camTween = null;
  }
  controls.target.x = clamp(controls.target.x, -62, 62); controls.target.z = clamp(controls.target.z, -42, 42); controls.target.y = 0;
  controls.update();
  hintTag.pos.set(boat.position.x, 9, boat.position.z);
  updateTags();
  placeCard();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
if (!state.introSeen) startIntro(); else hintTag.el.hidden = false;
requestAnimationFrame(frame);
})();
